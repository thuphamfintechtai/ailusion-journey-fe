# Frontend homelab. Compose dev (compose.yaml) không đổi.
#
#   cp .env.homelab.example .env.homelab
#   docker compose --env-file .env.homelab -f compose.homelab.yaml up -d --build

name: ailusion-fe

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://journey.ailusion.io.vn}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://journey-api.ailusion.io.vn}
        NEXT_PUBLIC_VIETMAP_KEY: ${NEXT_PUBLIC_VIETMAP_KEY:-}
        NEXT_PUBLIC_LANGSMITH_PROJECT_URL: ${NEXT_PUBLIC_LANGSMITH_PROJECT_URL:-}
        NEXT_PUBLIC_LANGFUSE_PROJECT_URL: ${NEXT_PUBLIC_LANGFUSE_PROJECT_URL:-}
    image: ailusion-journey-fe:homelab
    container_name: ailusion-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik_net}
      - traefik.http.routers.ailusion-web.rule=Host(`${WEB_HOST:-journey.ailusion.io.vn}`)
      - traefik.http.routers.ailusion-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.ailusion-web.tls=true
      - traefik.http.routers.ailusion-web.service=ailusion-web
      - traefik.http.services.ailusion-web.loadbalancer.server.port=3000
      - traefik.http.services.ailusion-web.loadbalancer.healthcheck.path=/
      - traefik.http.services.ailusion-web.loadbalancer.healthcheck.interval=10s

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_net}
